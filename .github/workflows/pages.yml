name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages は CSS と JS を10分キャッシュさせるので、更新してもブラウザが古いファイルを使い続ける。
      # 読み込む URL にコミットごとの値を付けて、デプロイのたびに新しいファイルとして取りに行かせる。
      - name: Add version to asset URLs
        run: sed -i -E "s/(src|href)=\"([a-z]+\.(js|css))\"/\1=\"\2?v=${GITHUB_SHA::7}\"/g" public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
